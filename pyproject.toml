[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "octoha"
version = "0.1.0"
description = "Home Assistant integration for Octopus Energy smart meter data"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Sam Carrington", email = "octopus@gwawr.co.uk"}
]
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = []

[project.optional-dependencies]
dev = [
    "homeassistant>=2024.1.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "aioresponses>=0.7.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/samcarrington/octoha"
"Bug Tracker" = "https://github.com/samcarrington/octoha/issues"
"Documentation" = "https://github.com/samcarrington/octoha#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "ARG",    # flake8-unused-arguments
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "PTH",    # flake8-use-pathlib
    "ERA",    # eradicate
    "PL",     # pylint
    "RUF",    # ruff-specific
]
ignore = [
    "PLR0913",  # Too many arguments
    "PLR0915",  # Too many statements
    "PLR2004",  # Magic value comparison
    "PLC0415",  # Import not at top-level (common pattern in tests)
    "TC001",    # Move import into type-checking block (false positives with dataclasses)
    "TC002",    # Move third-party import into type-checking block
    "TC003",    # Move stdlib import into type-checking block
    "RUF022",   # __all__ is not sorted (we use logical grouping with comments)
    "ARG001",   # Unused function argument (HA requires specific signatures)
    "ARG002",   # Unused method argument (HA requires specific signatures)
    "ERA001",   # Commented-out code (used for documentation in tests)
]

[tool.ruff.lint.isort]
known-first-party = ["custom_components.octoha"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/custom_components/octoha"]
omit = ["*/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
